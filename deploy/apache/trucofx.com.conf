<VirtualHost *:80>
    ServerName trucofx.com
    ServerAlias www.trucofx.com
    DocumentRoot /var/www/html/trucofx.com

    <Directory /var/www/html/trucofx.com>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /var/log/httpd/trucofx.com_error.log
    CustomLog /var/log/httpd/trucofx.com_access.log combined

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge/

    RewriteCond %{HTTP_HOST} ^www\.trucofx\.com [NC]
    RewriteRule ^(.*)$ http://trucofx.com$1 [L,R=301]

    # Redirige todo el tráfico a HTTPS
    RewriteCond %{SERVER_NAME} =trucofx.com [OR]
    RewriteCond %{SERVER_NAME} =www.trucofx.com
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
