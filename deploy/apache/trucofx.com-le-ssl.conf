<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName trucofx.com
    ServerAlias www.trucofx.com
    DocumentRoot /var/www/html/trucofx.com

    <Directory /var/www/html/trucofx.com>
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html/trucofx.com/test>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /var/log/httpd/trucofx.com_error.log
    CustomLog /var/log/httpd/trucofx.com_access.log combined

    # ── Proxy TrucoFX (PM2 truco-api, PORT=5129 en back/.env) ───────────────
    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"

    # API REST + uploads (HTTP al Node local)
    ProxyPass        /api http://127.0.0.1:5129/api
    ProxyPassReverse /api http://127.0.0.1:5129/api

    ProxyPass        /uploads http://127.0.0.1:5129/uploads
    ProxyPassReverse /uploads http://127.0.0.1:5129/uploads

    # Socket.IO: NO usar ProxyPass /socket.io aquí (compite con Rewrite [P]).
    # WebSocket → ws:// ; polling → http://
    RewriteEngine On

    RewriteCond %{HTTP_HOST} ^www\.trucofx\.com$ [NC]
    RewriteRule ^ https://trucofx.com%{REQUEST_URI} [R=301,L]

    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/socket.io/?(.*)$ ws://127.0.0.1:5129/socket.io/$1 [P,L]

    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule ^/socket.io/?(.*)$ http://127.0.0.1:5129/socket.io/$1 [P,L]

    ProxyPassReverse /socket.io/ http://127.0.0.1:5129/socket.io/

    # Verificación:
    #   curl -s https://trucofx.com/api/health
    #   curl -s "https://trucofx.com/socket.io/?EIO=4&transport=polling"

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/trucofx.com/cert.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/trucofx.com/privkey.pem
    SSLCertificateChainFile /etc/letsencrypt/live/trucofx.com/chain.pem
</VirtualHost>
</IfModule>
